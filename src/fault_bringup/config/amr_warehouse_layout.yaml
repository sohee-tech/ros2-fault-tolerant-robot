# Key locations in worlds/amr_warehouse.world (generated by tools/gen_amr_warehouse.py).
# Frame: Gazebo world, x = east, y = north, origin = central intersection. Units: m, rad.
# Inner floor 14 m x 10 m: x in [-7, 7], y in [-5, 5]. Main aisle x in [-1, 1], cross aisle y in [-1, 1].
# Intended as the starting point for SLAM / Nav2 waypoint missions (not used by the fault system).
world_size: {x: 14.0, y: 10.0}

spawn:            {x: 0.0, y: -4.0, yaw: 1.5708}   # start zone, facing north (world:=warehouse)
spawn_demo:       {x: 0.0, y: -3.9, yaw: 0.0}      # integrated demo: 0.4 m circle around (0, -3.5)

nav2_start_candidates:
  - {name: start_zone,   x: 0.0,  y: -4.0,   yaw: 1.5708}
  - {name: charge_bay_1, x: -6.1, y: -0.475, yaw: 3.1416}   # parked facing the dock
  - {name: charge_bay_2, x: -6.1, y: 0.475,  yaw: 3.1416}

waypoints:
  - {name: intersection,      x: 0.0,  y: 0.0,  yaw: 0.0}      # open 4-way intersection
  - {name: east_cross_aisle,  x: 5.5,  y: 0.5,  yaw: 0.0}      # passes north of pallet_cross_e
  - {name: ne_narrow_aisle,   x: 4.0,  y: 3.1,  yaw: 3.1416}   # 1.0 m aisle between NE racks
  - {name: west_cross_aisle,  x: -5.0, y: -0.4, yaw: 3.1416}   # passes south of pallet_cross_w
  - {name: sw_narrow_aisle,   x: -4.0, y: -3.1, yaw: 0.0}      # 1.0 m aisle between SW racks

goal:             {name: delivery_zone, x: 0.0, y: 3.7, yaw: 1.5708}   # drop-off pallet at y 4.4..4.9

obstacles:        # pallets inside aisles (box footprints: center, size)
  - {name: pallet_cross_e,  x: 3.6,  y: -0.45, sx: 1.0, sy: 0.8}
  - {name: pallet_cross_w,  x: -3.2, y: 0.45,  sx: 1.0, sy: 0.8}
  - {name: pallet_main_n,   x: 0.45, y: 2.0,   sx: 0.8, sy: 0.8}
  - {name: pallet_delivery, x: 0.0,  y: 4.65,  sx: 0.8, sy: 0.5}
